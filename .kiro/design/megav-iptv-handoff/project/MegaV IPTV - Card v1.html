<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>MegaV IPTV — Карточка канала · 3 варианта</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Bitter:ital,wght@0,400;0,600;1,400;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="themes.css"/>
<style>
  body { background: #06080f; }
  #root { width: 100vw; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="catalog.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="screens/detail-helpers.jsx"></script>
<script type="text/babel" src="screens/detail-variants.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const TODAY_PROGRAMS = [
  { time: "21:00", title: "Дневной эфир. Хроника", state: "past" },
  { time: "22:30", title: "Новости в 22:30", state: "past" },
  { time: "23:15", title: "Волны Чёрного моря", state: "now" },
  { time: "00:30", title: "Дикая орхидея", state: "next" },
  { time: "02:15", title: "Зеркало", state: "future" },
  { time: "04:00", title: "Бриллиантовая рука", state: "future" },
];

function App() {
  const [hero, setHero] = useState(FIXTURE_FEATURED[0]);
  const [hero2, setHero2] = useState(FIXTURE_FEATURED[1]);
  const [hero3, setHero3] = useState(FIXTURE_FEATURED[4]);

  useEffect(() => {
    loadFeatured(10).then(r => {
      const arr = r.data || [];
      if (arr[0]) setHero(arr[0]);
      if (arr[1]) setHero2(arr[1]);
      if (arr[4]) setHero3(arr[4]);
    });
  }, []);

  return (
    <div className="theme-host theme-cobalt font-russian" style={{minHeight: "100vh"}}>
      <DesignCanvas
        title="MegaV IPTV"
        subtitle="Карточка канала · D-pad / mouse · 3 варианта фокуса"
      >
        <DCSection id="detail" title="Карточка канала">
          <DCArtboard id="full-bleed" label="A · Full-bleed cinema" width={1280} height={720}>
            <DetailFullBleed item={hero} />
          </DCArtboard>
          <DCArtboard id="split" label="B · Split: poster + EPG" width={1280} height={720}>
            <DetailSplit item={hero2} todayPrograms={TODAY_PROGRAMS} />
          </DCArtboard>
          <DCArtboard id="minimal" label="C · Minimal poster" width={1280} height={720}>
            <DetailMinimal item={hero3} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
