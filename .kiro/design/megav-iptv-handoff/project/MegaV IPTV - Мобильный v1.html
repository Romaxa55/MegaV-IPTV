<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>MegaV IPTV — Мобильный</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="themes.css"/>
<style>
  body { background: #06060a; }
  #root { width: 100vw; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="catalog.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="screens/mobile-v2.jsx"></script>

<script type="text/babel" data-presets="env,react">
function PhoneShell({ children }) {
  return (
    <IOSDevice width={402} height={874} dark={true}>
      {children}
    </IOSDevice>
  );
}

function App() {
  return (
    <div className="theme-host theme-cobalt font-modern" style={{minHeight: "100vh"}}>
      <DesignCanvas
        title="MegaV IPTV"
        subtitle="Mobile · Flutter · Главная · Карточка · Плеер · iOS frame"
      >
        <DCSection id="mobile" title="Мобильное приложение">
          <DCArtboard id="phones" label="Главная · Карточка · Плеер" width={1380} height={960}>
            <div style={{
              display: "flex", gap: 32, alignItems: "center",
              padding: "32px",
              minHeight: "100%",
              background: "linear-gradient(135deg, #0c0d12 0%, #06060a 100%)",
            }}>
              <PhoneShell><MobileHome /></PhoneShell>
              <PhoneShell><MobileDetail /></PhoneShell>
              <PhoneShell><MobilePlayer /></PhoneShell>
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
