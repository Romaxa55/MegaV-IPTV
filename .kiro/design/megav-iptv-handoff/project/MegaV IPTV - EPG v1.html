<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<title>MegaV IPTV — EPG (программа передач)</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Golos+Text:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Bitter:ital,wght@0,400;0,600;1,400;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="themes.css"/>
<style>
  body { background: #06060a; }
  #root { width: 100vw; min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="catalog.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="screens/detail-helpers.jsx"></script>
<script type="text/babel" src="screens/epg-v2.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function App() {
  const [channels, setChannels] = useState(FIXTURE_FEATURED);
  const [pool, setPool] = useState(FIXTURE_FEATURED);

  useEffect(() => {
    loadFeatured(12).then(r => {
      const arr = r.data || [];
      if (arr.length) {
        setChannels(arr);
        setPool(arr.length > 4 ? arr : [...arr, ...FIXTURE_FEATURED]);
      }
    });
  }, []);

  return (
    <div className="theme-host theme-cobalt font-modern" style={{minHeight: "100vh"}}>
      <DesignCanvas
        title="MegaV IPTV"
        subtitle="EPG · программа передач · D-pad nav · NOW marker · 8-часовое окно"
      >
        <DCSection id="epg" title="Программа передач">
          <DCArtboard id="grid" label="Editorial grid · NOW · live badge · preview strip" width={1440} height={900}>
            <ScreenEPGv2 channels={channels} pool={pool} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
