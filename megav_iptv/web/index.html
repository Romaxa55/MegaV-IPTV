<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="megav_iptv">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>megav_iptv</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Custom Flutter bootstrap that pins the web renderer to CanvasKit.

    Rationale: the Visual Feedback Pipeline (.kiro/specs/visual-feedback-pipeline)
    requires deterministic font/gradient rasterization that matches the TV build.
    The HTML/CanvasRenderer fallback would introduce diff noise vs. JSX baselines.
    The build pipeline also passes `--web-renderer canvaskit` for defence in depth.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
    * https://docs.flutter.dev/platform-integration/web/renderers
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      config: {
        renderer: "canvaskit",
      },
    });
  </script>
</body>
</html>
