name: megav_iptv
description: "MegaV IPTV Player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Video Engine — Primary (media_kit / libmpv / FFmpeg)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Video Engine — System (Media3 native Activity, AFR, HDR)
  flutter_tv_media3: ^0.2.0

  # UI & Adaptivity
  flutter_screenutil: ^5.9.3
  responsive_builder: ^0.7.1
  google_fonts: ^6.2.1

  # Architecture
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Network
  http: ^1.2.2
  video_player: ^2.11.1
  visibility_detector: ^0.4.0+2
  flag: ^7.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
